

name: PR Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: docker build -t log-monitor .

    - name: Run
      run: docker run log-monitor > output.txt

    - name: Check ERROR
      run: |
        if grep "ERROR" output.txt | grep -v "test"; then
          echo "❌ Real ERROR found"
          exit 1
        else
          echo "✅ OK"
        fi
