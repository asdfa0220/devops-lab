

name: Main CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout
      uses: actions/checkout@v4

    # ✅ 新增：登入 Docker Hub
    - name: 2. Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # ✅ 修改：image 加上 username
    - name: 3. Build Docker Image (with version)
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/log-monitor:${{ github.sha }} .

    # ✅ 新增：push image
    - name: 4. Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/log-monitor:${{ github.sha }}

    - name: 5. Run container
      run: docker run ${{ secrets.DOCKER_USERNAME }}/log-monitor:${{ github.sha }} > output.txt

    - name: 6. Show logs
      run: cat output.txt

    - name: 7. Check ERROR
      run: |
        if grep "ERROR" output.txt | grep -v "test"; then
          echo "❌ Real ERROR found"
          exit 1
        else
          echo "✅ OK"
        fi

    - name: 8. Simulate Deploy 🚀
      if: success()
      run: echo "Deploy success ✅"

